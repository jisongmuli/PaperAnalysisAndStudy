<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>导出 PDF · 论文解析与提问</title>
    <link rel="stylesheet" href="/vendor/katex/katex.min.css" />
    <style>
      :root {
        --text: #1b1f24;
        --muted: #5b6470;
        --line: #dcdfe5;
        --accent: #3b3fd8;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", "Source Han Sans SC", sans-serif;
        color: var(--text);
        font-size: 12.5pt;
        line-height: 1.7;
        background: #f1f2f5;
      }
      .bar {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 18px;
        background: #fff;
        border-bottom: 1px solid var(--line);
        box-shadow: 0 1px 6px rgba(16, 24, 40, 0.06);
      }
      .bar button {
        padding: 7px 15px;
        border-radius: 8px;
        border: 1px solid transparent;
        background: linear-gradient(135deg, #4f46e5, #6366f1);
        color: #fff;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
      }
      .bar .ghost {
        background: #fff;
        color: #333;
        border-color: var(--line);
      }
      .bar .info { color: var(--muted); font-size: 12px; margin-left: auto; }
      .page {
        max-width: 820px;
        margin: 20px auto 60px;
        background: #fff;
        padding: 42px 48px 56px;
        box-shadow: 0 8px 30px rgba(16, 24, 40, 0.09);
        border-radius: 6px;
      }
      h1 { font-size: 20pt; margin: 0 0 6px; letter-spacing: -0.3px; }
      .meta { color: var(--muted); font-size: 10.5pt; margin-bottom: 4px; }
      .rule { height: 1px; background: var(--line); margin: 18px 0 22px; }
      h2 {
        font-size: 14.5pt;
        margin: 26px 0 12px;
        padding-bottom: 5px;
        border-bottom: 2px solid var(--text);
      }
      .item {
        margin: 0 0 16px;
        padding: 0 0 12px;
        border-bottom: 1px dashed var(--line);
        page-break-inside: avoid;
        break-inside: avoid;
      }
      .item-head {
        font-size: 10.5pt;
        font-weight: 700;
        color: var(--accent);
        margin-bottom: 4px;
      }
      .ptext { margin: 0 0 8px; color: #2b3138; }
      .ptext.heading { font-weight: 700; }
      .qa { margin: 8px 0 0; }
      .q { font-weight: 600; }
      .q b, .a b { color: var(--accent); }
      .a {
        margin: 4px 0 0 0;
        padding: 8px 12px;
        background: #f7f8fa;
        border-left: 3px solid var(--accent);
        border-radius: 0 6px 6px 0;
        white-space: pre-wrap;
      }
      .a p { margin: 0 0 6px; white-space: pre-wrap; }
      .a ul, .a ol { margin: 4px 0 6px; padding-left: 22px; }
      .a code {
        font-family: ui-monospace, Consolas, monospace;
        font-size: 10.5pt;
        background: #eef0f6;
        padding: 1px 4px;
        border-radius: 4px;
      }
      .a pre {
        background: #0f1115;
        color: #e6e8eb;
        padding: 9px 11px;
        border-radius: 6px;
        overflow-x: auto;
        font-size: 10.5pt;
        white-space: pre-wrap;
      }
      .a table {
        border-collapse: collapse;
        margin: 6px 0;
        font-size: 10.5pt;
        width: 100%;
      }
      .a th, .a td {
        border: 1px solid var(--line);
        padding: 3px 8px;
        text-align: left;
      }
      .a th { background: #f1f2f5; font-weight: 600; }
      .a blockquote {
        margin: 5px 0;
        padding: 2px 10px;
        border-left: 3px solid var(--line);
        color: var(--muted);
      }
      .a hr { border: none; border-top: 1px solid var(--line); margin: 8px 0; }
      .a .katex-display { margin: 6px 0; overflow-x: auto; overflow-y: hidden; }
      .ptext .katex { font-size: 1em; }
      .math-fallback {
        font-family: ui-monospace, Consolas, monospace;
        font-size: 10.5pt;
        color: #b91c1c;
        word-break: break-all;
      }
      .empty { color: var(--muted); font-style: italic; }
      .loading { display: grid; place-items: center; height: 60vh; color: var(--muted); }
      .err { color: #b91c1c; padding: 24px; }
      @media print {
        body { background: #fff; font-size: 11.5pt; }
        .bar { display: none !important; }
        .page {
          margin: 0;
          max-width: none;
          box-shadow: none;
          border-radius: 0;
          padding: 0;
        }
        h2 { page-break-after: avoid; break-after: avoid; }
        .item { border-bottom-color: #eaecef; }
      }
      @page { margin: 16mm 14mm; }
    </style>
  </head>
  <body>
    <div class="bar">
      <button onclick="window.print()">打印 / 另存为 PDF</button>
      <button class="ghost" onclick="window.close()">关闭</button>
      <span class="info">导出为 PDF：在打印对话框中选择「另存为 PDF」</span>
    </div>
    <div id="root"><div class="loading">正在加载文档与问答记录…</div></div>

    <script src="/vendor/katex/katex.min.js"></script>
    <script>
      const params = new URLSearchParams(location.search);
      const docId = params.get('doc');
      const includeOriginal = params.get('includeOriginal') !== '0';

      const esc = (s) =>
        String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

      const hasKatex = typeof katex !== 'undefined';

      /** KaTeX 渲染；失败时回退为等宽原文 */
      function tex(src, display) {
        const code = String(src || '').trim();
        if (!code) return '';
        if (!hasKatex) return `<code class="math-fallback">${esc(code)}</code>`;
        try {
          return katex.renderToString(code, {
            displayMode: !!display,
            throwOnError: false,
            strict: 'ignore',
            trust: false,
            errorColor: '#b91c1c',
          });
        } catch (e) {
          return `<code class="math-fallback">${esc(code)}</code>`;
        }
      }

      const MATH_SPLIT = /(\$\$[\s\S]+?\$\$|\$[^$\n]+?\$|\\\([\s\S]+?\\\)|\\\[[\s\S]+?\\\])/g;

      /** 行内：先切出数学公式，其余部分做转义 + 行内 Markdown */
      function inline(t) {
        return String(t)
          .split(MATH_SPLIT)
          .map((part) => {
            if (!part) return '';
            if (part.startsWith('$$') && part.endsWith('$$')) return tex(part.slice(2, -2), true);
            if (part.startsWith('$') && part.endsWith('$')) return tex(part.slice(1, -1), false);
            if (part.startsWith('\\(') && part.endsWith('\\)')) return tex(part.slice(2, -2), false);
            if (part.startsWith('\\[') && part.endsWith('\\]')) return tex(part.slice(2, -2), true);
            return esc(part)
              .replace(/`([^`]+)`/g, '<code>$1</code>')
              .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
              .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>')
              .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2">$1</a>');
          })
          .join('');
      }

      /** 极简 markdown → html */
      function md(text) {
        const lines = String(text ?? '').replace(/\r\n?/g, '\n').split('\n');
        const out = [];
        let i = 0;
        let list = null;
        const flushList = () => {
          if (list) {
            out.push(`<${list.tag}>${list.items.map((t) => `<li>${inline(t)}</li>`).join('')}</${list.tag}>`);
            list = null;
          }
        };
        while (i < lines.length) {
          const line = lines[i];
          if (/^\s*```/.test(line)) {
            const buf = [];
            i++;
            while (i < lines.length && !/^\s*```/.test(lines[i])) buf.push(lines[i++]);
            i++;
            flushList();
            out.push(`<pre>${esc(buf.join('\n'))}</pre>`);
            continue;
          }
          // 块级公式 $$ ... $$（可跨行）
          if (/^\s*\$\$/.test(line)) {
            const buf = [];
            let rest = line.replace(/^\s*\$\$/, '');
            if (/\$\$\s*$/.test(rest)) {
              buf.push(rest.replace(/\$\$\s*$/, ''));
              i++;
            } else {
              buf.push(rest);
              i++;
              while (i < lines.length && !/\$\$\s*$/.test(lines[i])) buf.push(lines[i++]);
              if (i < lines.length) buf.push(lines[i++].replace(/\$\$\s*$/, ''));
            }
            flushList();
            out.push(`<div class="md-math-block">${tex(buf.join('\n'), true)}</div>`);
            continue;
          }
          if (/^\s*\\\[/.test(line)) {
            const buf = [];
            let rest = line.replace(/^\s*\\\[/, '');
            if (/\\\]\s*$/.test(rest)) {
              buf.push(rest.replace(/\\\]\s*$/, ''));
              i++;
            } else {
              buf.push(rest);
              i++;
              while (i < lines.length && !/\\\]\s*$/.test(lines[i])) buf.push(lines[i++]);
              if (i < lines.length) buf.push(lines[i++].replace(/\\\]\s*$/, ''));
            }
            flushList();
            out.push(`<div class="md-math-block">${tex(buf.join('\n'), true)}</div>`);
            continue;
          }
          const h = /^(#{1,6})\s+(.*)$/.exec(line);
          if (h) {
            flushList();
            out.push(`<p><strong>${inline(h[2])}</strong></p>`);
            i++;
            continue;
          }
          // 管道表格
          if (
            line.includes('|') &&
            i + 1 < lines.length &&
            /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(lines[i + 1])
          ) {
            flushList();
            const cells = (l) =>
              l.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map((c) => c.trim());
            const head = cells(line);
            i += 2;
            const rows = [];
            while (i < lines.length && lines[i].includes('|') && lines[i].trim()) rows.push(cells(lines[i++]));
            out.push(
              `<table><thead><tr>${head.map((c) => `<th>${inline(c)}</th>`).join('')}</tr></thead>` +
                `<tbody>${rows
                  .map((r) => `<tr>${r.map((c) => `<td>${inline(c)}</td>`).join('')}</tr>`)
                  .join('')}</tbody></table>`,
            );
            continue;
          }
          // 引用块
          if (/^\s*>\s?/.test(line)) {
            flushList();
            const buf = [];
            while (i < lines.length && /^\s*>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^\s*>\s?/, ''));
            out.push(`<blockquote>${inline(buf.join(' '))}</blockquote>`);
            continue;
          }
          // 分隔线
          if (/^\s*([-*_])\1{2,}\s*$/.test(line)) {
            flushList();
            out.push('<hr/>');
            i++;
            continue;
          }
          if (/^\s*([-*+]|\d+[.)])\s+/.test(line)) {
            const ordered = /^\s*\d+[.)]\s+/.test(line);
            if (!list || list.tag !== (ordered ? 'ol' : 'ul')) {
              flushList();
              list = { tag: ordered ? 'ol' : 'ul', items: [] };
            }
            list.items.push(line.replace(/^\s*([-*+]|\d+[.)])\s+/, ''));
            i++;
            continue;
          }
          if (line.trim() === '') {
            flushList();
            i++;
            continue;
          }
          flushList();
          out.push(`<p>${inline(line)}</p>`);
          i++;
        }
        flushList();
        return out.join('');
      }

      function pair(messages = []) {
        const qa = [];
        let pending = null;
        for (const m of messages) {
          if (m.role === 'user') {
            if (pending) qa.push({ ...pending, answer: '' });
            pending = { question: m.content, answer: '', cited: m.citedParagraphIds };
          } else if (m.role === 'assistant' && pending) {
            pending.answer = m.error ? '' : m.content;
            if (m.error) pending.answer = `［请求失败］${m.error}`;
            qa.push(pending);
            pending = null;
          }
        }
        if (pending) qa.push({ ...pending, answer: '' });
        return qa;
      }

      async function main() {
        const rootEl = document.getElementById('root');
        if (!docId) {
          rootEl.innerHTML = '<div class="err">缺少文档参数（?doc=…）</div>';
          return;
        }
        try {
          const res = await fetch(`/api/documents/${docId}`);
          if (!res.ok) throw new Error((await res.json()).error || `HTTP ${res.status}`);
          const { document: doc } = await res.json();
          const byId = new Map(doc.paragraphs.map((p) => [p.id, p]));
          const label = (ids) =>
            (ids || [])
              .map((id) => (byId.has(id) ? `第 ${byId.get(id).index + 1} 段` : id))
              .join('、');

          let html = '';
          html += `<h1>${esc(doc.title)}</h1>`;
          html += `<div class="meta">来源文件：${esc(doc.filename || '（粘贴文本）')} ｜ 段落数：${doc.paragraphs.length} ｜ 导出时间：${new Date().toLocaleString('zh-CN')}</div>`;
          html += '<div class="rule"></div>';

          const items = doc.paragraphs
            .map((p) => ({ p, qa: pair(doc.threads?.[p.id]?.messages || []) }))
            .filter((x) => includeOriginal || x.qa.length);

          const answered = items.filter((x) => x.qa.length);

          if (includeOriginal) {
            html += '<h2>正文与段落问答</h2>';
            if (!items.length) html += '<p class="empty">暂无内容</p>';
            for (const { p, qa } of items) {
              html += '<div class="item">';
              html += `<div class="item-head">第 ${p.index + 1} 段${p.page ? `（第 ${p.page} 页）` : ''}</div>`;
              html += `<p class="ptext ${p.type === 'heading' ? 'heading' : ''}">${esc(p.text)}</p>`;
              qa.forEach((x, n) => {
                html += '<div class="qa">';
                html += `<div class="q"><b>问${qa.length > 1 ? n + 1 : ''}${x.cited?.length ? `（引用 ${label(x.cited)}）` : ''}：</b>${esc(x.question)}</div>`;
                html += `<div class="a">${x.answer ? md(x.answer) : '<span class="empty">（未获得回答）</span>'}</div>`;
                html += '</div>';
              });
              html += '</div>';
            }
          }

          html += '<h2>问答记录清单</h2>';
          let n = 0;
          for (const { p, qa } of answered) {
            qa.forEach((x) => {
              n += 1;
              html += '<div class="item">';
              html += `<div class="item-head">Q${n}　第 ${p.index + 1} 段${x.cited?.length ? `　引用 ${label(x.cited)}` : ''}</div>`;
              html += `<div class="q"><b>问：</b>${esc(x.question)}</div>`;
              html += `<div class="a">${x.answer ? md(x.answer) : '<span class="empty">（未获得回答）</span>'}</div>`;
              html += '</div>';
            });
          }
          const crossQa = pair(doc.threads?.__cross__?.messages || []);
          for (const x of crossQa) {
            n += 1;
            html += '<div class="item">';
            html += `<div class="item-head">Q${n}　跨段落关联提问${x.cited?.length ? `　引用 ${label(x.cited)}` : ''}</div>`;
            html += `<div class="q"><b>问：</b>${esc(x.question)}</div>`;
            html += `<div class="a">${x.answer ? md(x.answer) : '<span class="empty">（未获得回答）</span>'}</div>`;
            html += '</div>';
          }
          if (n === 0) html += '<p class="empty">暂无问答记录</p>';

          rootEl.innerHTML = `<div class="page">${html}</div>`;
          document.title = `${doc.title} · 问答记录`;
          setTimeout(() => {
            if (params.get('auto') !== '0') window.print();
          }, 400);
        } catch (err) {
          rootEl.innerHTML = `<div class="err">加载失败：${esc(err.message)}</div>`;
        }
      }
      main();
    </script>
  </body>
</html>
